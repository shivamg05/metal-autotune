[project]
name = "metal-autotune"
version = "0.1.0"
description = "Autonomous inter-kernel optimizer for MLX models on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.2",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "mlx-lm>=0.31.3",
    "pytest>=8.0",
]

[project.scripts]
autotune = "autotuner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotuner", "autotuner_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=10"
markers = [
    "integration: runs whole jobs or live models; minutes, not seconds. Skip with -m 'not integration'",
]
