# The job that produced lfm2_5_1_2b_prefill_artifact/. Its kernels come from the
# 2026-09-25 search on this manifest; on 2026-09-26 they were reinstalled
# through the normal install path, checked at every prompt length (3 to
# 2,049 tokens, set automatically for this MLX-LM prompt workload), timed
# again end to end and exported. The search itself was not rerun.
model: ../../models/lfm2_5_1_2b_instruct_4bit.py   # Liquid's LFM2.5-1.2B-Instruct, pretrained 4-bit weights
baseline: compiled
use_library_inference: true    # time MLX-LM's own generate path
# On-device retrieval or agent request: a system prompt plus a retrieved
# document or tool definitions, about 2,000 tokens, then the first token of
# the answer. This is the wait before the reply starts (about 1.7 s on an M4).
# Random token IDs stand in for the text; this is not a quality test.
workloads:
  - name: rag_prompt_2048
    context: 0                  # empty cache: the prompt is read from scratch
    inputs:
      - shape: [1, 2048]
        dtype: int32
        low: 0
        high: 64402             # the tokenizer's real token IDs
budget: {per_region: 30, total: 180}   # candidate-attempt limits, not a time limit
final_benchmark:
  # Time a whole MLX-LM request that reads the prompt and writes one token.
  steps: 1
  pairs: 8
  warmup_steps: 3
