model: models/qwen3_0.6b_4bit_decode.py   # the bf16 model quantized in memory; the model file says why
workloads:
  - name: decode
    inputs:
      - shape: [1, 1]
        dtype: int32
        low: 0
        high: 151936    # Qwen3's vocabulary size
baseline: compiled      # "faster" is measured against the model under mx.compile
budget: {per_region: 24, total: 120}
