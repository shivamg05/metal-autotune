model: models/recurrentgemma_2b.py   # RecurrentGemma 2B (Griffin: recurrent blocks + local attention), pretrained, prefill only
baseline: compiled
use_library_inference: true
workloads:
  # Three prompt lengths across the 480 to 520 band, each timed on its own and
  # each served by the installed code; a length not listed runs the original.
  # No context: the library starts each prompt from an empty cache.
  - name: prefill_480
    inputs:
      - shape: [1, 480]
        dtype: int32
        low: 0
        high: 256000
  - name: prefill_500
    inputs:
      - shape: [1, 500]
        dtype: int32
        low: 0
        high: 256000
  - name: prefill_520
    inputs:
      - shape: [1, 520]
        dtype: int32
        low: 0
        high: 256000
budget:
  per_region: 12
  total: 60
final_benchmark:
  # Complete an MLX-LM request for one token, starting from an empty cache.
  steps: 1
  pairs: 8
  warmup_steps: 3
