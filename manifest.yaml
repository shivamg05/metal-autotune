model: models/whisper_large_v3_turbo_encoder.py   # the checkpoint local transcription apps commonly ship
baseline: compiled
use_library_inference: false  # measure the encoder call
# Transcribe a recording: Whisper pads or cuts audio into 30-second windows and
# encodes each one on its own, so every call is one window of 3000 mel frames
# (10 ms hop) x 128 mel bins (large-v3). A made-up spectrogram stands in for audio.
workloads:
  - name: encode_30s_window
    inputs:
      - shape: [1, 3000, 128]
        dtype: float16
budget: {per_region: 12, total: 60}   # candidate-attempt limits, not a time limit
final_benchmark: {steps: 10, pairs: 4, warmup_steps: 3}
